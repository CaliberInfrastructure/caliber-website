<!-- GoHighLevel chat widget. Carries the A2P 10DLC opt-in snippet, so it must
     load on every page view — but it was auto-opening over the hero copy on a
     phone before the visitor had read a sentence. Loading is deferred until the
     first scroll or interaction, with an 8s backstop so it always arrives. The
     auto-open delay itself is a setting inside the GHL widget config; this only
     moves when the widget appears. -->
<script>
  (function () {
    var loaded = false;
    function loadWidget() {
      if (loaded) return;
      loaded = true;
      cleanup();
      var s = document.createElement('script');
      s.src = 'https://widgets.leadconnectorhq.com/loader.js';
      s.async = true;
      s.setAttribute('data-resources-url', 'https://widgets.leadconnectorhq.com/chat-widget/loader.js');
      s.setAttribute('data-widget-id', '6a4fd176fb32070603baaa17');
      s.setAttribute('data-source', 'WEB_USER');
      document.body.appendChild(s);
    }
    var events = ['scroll', 'pointerdown', 'keydown', 'touchstart'];
    function cleanup() {
      events.forEach(function (e) { window.removeEventListener(e, loadWidget); });
    }
    events.forEach(function (e) { window.addEventListener(e, loadWidget, { passive: true, once: true }); });
    setTimeout(loadWidget, 8000);
  })();
</script>
